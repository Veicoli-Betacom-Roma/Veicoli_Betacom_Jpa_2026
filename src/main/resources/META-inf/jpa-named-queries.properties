search.veicoli=select v from Veicolo v \
where (:id IS NULL OR v.id = :id) \
AND (:marca IS NULL OR LOWER(v.marca) LIKE LOWER(CONCAT('%', :marca, '%'))) \
AND (:modello IS NULL OR LOWER(v.modello) LIKE LOWER(CONCAT('%', :modello, '%'))) \
AND (:numeroRuote IS NULL OR v.numeroRuote = :numeroRuote) \
AND (:coloreId IS NULL OR v.colore.id = :coloreId) \
AND (:alimentazioneId IS NULL OR v.alimentazione.id = :alimentazioneId) \
AND (:categoriaId IS NULL OR v.categoria.id = :categoriaId) 